# Builds, attests, and publishes the plugin release.
#
# Trigger: push a bare-semver tag, e.g. `git tag 0.3.3 && git push origin 0.3.3`.
#
# The release assets (main.js / manifest.json / styles.css) are built HERE —
# never upload locally built assets to a public release, because that breaks
# the provenance chain this workflow establishes. Every asset is signed with
# the workflow's OIDC identity and published to Sigstore's transparency log,
# so anyone can verify it was built from this repository:
#
#   gh attestation verify main.js -R liyifan2004/obsidian-mineru-converter
#
# Obsidian's plugin review scanner checks these attestations on every release.

name: Build and release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # mint the OIDC token used to sign the attestation
      attestations: write # publish the attestation
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 固定 22（与 CI 及 fleet 其余仓库一致）。原先写 lts/*，会随 Node
          # LTS 换代而漂移 —— 实测当前 lts/* 已解析到 Node 26.13（npm 11.20），
          # 而 CI 用的是 22。商店审查会自己 npm ci && npm run build 并要求与
          # release 产物逐字节一致，两个 Node 大版本下的产物不保证一致。
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Obsidian review rules)
        run: npm run lint

      - name: Tests (offline verify scripts)
        run: npm run test

      - name: Build plugin
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      # Sign the exact bytes that get uploaded below.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css

      # Only the three files Obsidian downloads. No zips, no extras — the
      # review scanner flags any additional release asset.
      #
      # 用官方 gh CLI（与 fleet 其余 7 个仓库一致），而不是第三方的
      # softprops/action-gh-release —— 少一个第三方 action 依赖，行为可读。
      # 资产名仍是顶层 main.js / manifest.json / styles.css：gh CLI 上传时
      # 用 os.FileInfo.Name() 取 basename（见 cli/cli 的
      # pkg/cmd/release/shared/upload.go），目录前缀会被剥掉，与原先
      # softprops 的行为一致 —— 已发布过的 0.3.1~0.3.4 资产名可佐证。
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          gh release create "$GITHUB_REF_NAME" \
            plugin/main.js plugin/manifest.json plugin/styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
