# CI for MinerU Converter.
#
# The plugin lives in the `plugin/` subdirectory, so every step runs there.
# Runs the same gate the project uses locally:
#   lint (eslint-plugin-obsidianmd) → test (offline verify scripts) → build
#
# Until this workflow existed, `npm test` only ever ran on the author's
# machine — the release workflow never invoked it. A test that is not wired
# into CI is not a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugin

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Obsidian review rules)
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build plugin
        run: npm run build
