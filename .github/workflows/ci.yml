# CI for MinerU Converter.
#
# The plugin lives in the `plugin/` subdirectory, so every step runs there.
# Runs the same gate the project uses locally:
#   lint (eslint-plugin-obsidianmd) → test (offline verify scripts) → build
#
# Until this workflow existed, `npm test` only ever ran on the author's
# machine — the release workflow never invoked it. A test that is not wired
# into CI is not a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugin

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Obsidian review rules)
        run: npm run lint

      # CSS lint —— 与 Obsidian 商店审查同一份规则集。
      #
      # 本插件已在社区商店列表里。把 stylelint-config-obsidianmd 接进 CI，
      # !important 与 :has() 这两类问题会在**提交时**被拦下，
      # 而不是等发版后被商店审查打回、从列表里下架。
      - name: CSS lint
        run: npm run lint:styles

      - name: Tests
        run: npm run test

      - name: Build plugin
        run: npm run build
